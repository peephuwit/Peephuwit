name: generate games

on:
  schedule: # รันอัตโนมัติทุกๆ 24 ชั่วโมง
    - cron: "0 */24 * * *"
  workflow_dispatch: # กดรันเองได้
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # 1. สร้างเกม Pac-Man (ไฟล์จะถูกสร้างไว้ในโฟลเดอร์ dist)
      - name: generate pacman-contribution-graph.svg
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}

      # 2. สร้างเกมงู Snake (สั่งให้เซฟลงโฟลเดอร์ dist เดียวกัน)
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # 3. ส่งไฟล์ทั้ง 2 เกมขึ้นไปที่ branch output พร้อมกัน
      - name: push games to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
