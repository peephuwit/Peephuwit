name: generate games

on:
  schedule: # รันอัตโนมัติทุกๆ 24 ชั่วโมง
    - cron: "0 */24 * * *"
  workflow_dispatch: # กดรันเองได้
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # 1. สร้างเกม Pac-Man (ไฟล์จะถูกสร้างไว้ในโฟลเดอร์ dist)
      - name: generate pacman-contribution-graph.svg
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}

       # 2. สร้างเกมตีบล็อก Brick Breaker (เก็บในโฟลเดอร์ dist)
      - name: generate brick breaker
        uses: cyprieng/github-brick-breaker@main
        with:
          github_user_name: ${{ github.repository_owner }}
          output_path: dist/bricks.svg
          theme: github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 3. สร้างตาราง 3D Isometric (สร้างไว้ในโฟลเดอร์ profile-3d-contrib แล้วค่อยย้ายมารวมที่ dist)
      - name: generate 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: move 3D graph to dist folder
        run: mv profile-3d-contrib/* dist/

      # ส่งไฟล์ทั้งหมดใน dist ขึ้นไปเก็บที่ branch output
      - name: push all games to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
