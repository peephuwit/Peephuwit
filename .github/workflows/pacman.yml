name: generate games

on:
  schedule:
    - cron: "0 */24 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. สร้างเกม Pac-Man
      - name: generate pacman
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}

      # 2. สร้างตาราง 3D Isometric
      - name: generate 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@0.7.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      # 3. สร้างเกมตีบล็อกด้วยคำสั่ง npx และรวมไฟล์ทั้งหมดเข้าโฟลเดอร์ dist
      - name: generate brick breaker and organize files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          if [ -d "profile-3d-contrib" ]; then
            cp -r profile-3d-contrib/* dist/
          fi
          npx github-brick-breaker --username ${{ github.repository_owner }} --token ${{ secrets.GITHUB_TOKEN }} --output dist/bricks.svg || true

      # 4. ส่งไฟล์ทั้งหมดใน dist ขึ้นไปที่ branch output
      - name: push all games to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
