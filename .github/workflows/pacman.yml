name: generate games

on:
  schedule:
    - cron: "0 */24 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # สร้างโฟลเดอร์ dist รอไว้ก่อนเพื่อป้องกัน Error
      - name: Create dist folder
        run: mkdir -p dist

      # 1. สร้างเกม Pac-Man
      - name: generate pacman
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}

      # 2. สร้างเกมตีบล็อก Brick Breaker (แก้ไขพารามิเตอร์ให้ถูกต้อง)
      - name: generate brick breaker
        uses: cyprieng/github-brick-breaker@v1
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          output_path: dist/bricks.svg
          theme: github-dark

      # 3. สร้างตาราง 3D Isometric (ถ้าไม่เอา 3D ลบส่วนที่ 3 นี้ออกได้ครับ)
      - name: generate 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@0.7.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: copy 3D files to dist
        run: cp -r profile-3d-contrib/* dist/

      # ส่งไฟล์ทั้งหมดขึ้นไปที่ branch output
      - name: push all games to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
