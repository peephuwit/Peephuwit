name: generate games

on:
  schedule:
    - cron: "0 */24 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. สร้างเกม Pac-Man ก่อน (ระบบจะสร้างโฟลเดอร์ dist ให้)
      - name: generate pacman
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}

      # ตรวจสอบว่ามีโฟลเดอร์ dist แน่นอน
      - name: Ensure dist folder exists
        run: mkdir -p dist

      # 2. สร้างเกมตีบล็อก Brick Breaker (ใช้ @main และ output_svg)
      - name: generate brick breaker
        uses: cyprieng/github-brick-breaker@main
        continue-on-error: true
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          output_svg: dist/bricks.svg
          theme: github-dark

      # 3. สร้างตาราง 3D Isometric
      - name: generate 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@0.7.0
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: copy 3D files to dist
        run: |
          if [ -d "profile-3d-contrib" ]; then
            cp -r profile-3d-contrib/* dist/
          fi

      # 4. ส่งไฟล์ทั้งหมดใน dist ขึ้นไปที่ branch output
      - name: push all games to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
